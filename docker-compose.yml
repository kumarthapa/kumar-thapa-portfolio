name: kumarthapa-services
services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
  client:
    build: ./client
    init: true
    environment:
      NODE_ENV: production
    expose: ["3000"]
    networks: [app]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
  server:
    build: ./server
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      CACHE_TTL: ${CACHE_TTL:-60}
      NEWSLETTER_WEBHOOK_URL: ${NEWSLETTER_WEBHOOK_URL:-}
      NEWSLETTER_WEBHOOK_TOKEN: ${NEWSLETTER_WEBHOOK_TOKEN:-}
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      CONTACT_WEBHOOK_TOKEN: ${CONTACT_WEBHOOK_TOKEN:-}
    expose: ["4000"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, data]
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  app:
  data:
    internal: true
