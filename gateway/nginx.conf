server {
 listen 8080;
 server_name _;
 server_tokens off;
 client_max_body_size 16k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 keepalive_timeout 30s;
 resolver 127.0.0.11 valid=10s ipv6=off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 # Inline script is required by the default Next.js runtime. Tighten with nonces before launch.
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  set $api http://server:4000;
  proxy_pass $api;
  proxy_set_header Host $host;
  # Overwrite client-supplied forwarding headers at this trusted boundary.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
 location /health/ {
  set $api http://server:4000;
  proxy_pass $api;
 }
 location / {
  set $frontend http://client:3000;
  proxy_pass $frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
 }
}
